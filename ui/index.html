<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Argos</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head>
<body><main>
<header><span class="brand"><svg aria-hidden="true" viewBox="0 0 40 24"><path d="M2 12Q20 -7 38 12Q20 31 2 12Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="12" r="5" fill="currentColor"/></svg>Argos</span><span id="phase" role="status">Initializing</span></header>
<h1>Local capture</h1>
<p>Choose a screen or window. Audio uses the default playback device when capture starts. Restart capture after switching outputs.</p>
<section aria-label="Capture signals"><div><h2>Screen</h2><strong id="video">Waiting for selection</strong><small id="frames">0 frames</small></div>
<div><h2>Playback audio</h2><meter id="level" aria-label="Playback peak level" min="0" max="1" value="0"></meter><small id="audio">0 audio frames</small></div></section>
<p id="message" role="alert"></p>
<footer><button id="start" disabled>Start capture</button><button id="stop" disabled>Stop</button></footer>
</main></body></html>
