name: Windows build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    env:
      # Replaces the cross-build settings in .cargo/config.toml. Fixed CPU features keep the
      # build from targeting whatever processor the runner happens to have.
      # Link the C and C++ runtimes statically so the executable needs no redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
      TRANSCRIBE_CMAKE_ARGS: -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DGGML_NATIVE=OFF -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: rustup component add rustfmt
      - run: node --test tests/sharing.test.cjs
        working-directory: .
      - run: cargo fmt --all --check
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory Argos | Out-Null
          Copy-Item target/release/argos.exe Argos/
          if (Test-Path target/release/WebView2Loader.dll) { Copy-Item target/release/WebView2Loader.dll Argos/ }
          Compress-Archive -Path Argos -DestinationPath ../Argos-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: argos-windows-x64
          path: Argos-Windows-x64.zip
          if-no-files-found: error
      # One fixed download page for the newest pushed build.
      - name: Publish test build
        if: github.event_name != 'pull_request'
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --cleanup-tag --yes || true
          gh release create windows-latest Argos-Windows-x64.zip --prerelease --target "$GITHUB_SHA" \
            --title "Windows test build" --notes "Branch $GITHUB_REF_NAME, commit $GITHUB_SHA"
      # After publishing, so a test-harness problem cannot hold back a build to try.
      - run: cargo test --locked
