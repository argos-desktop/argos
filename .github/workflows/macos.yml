name: macOS capture
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: npx --yes --package=@tauri-apps/cli@2.12.6 -- tauri build --bundles app -- --locked
      - run: ditto -c -k --keepParent src-tauri/target/release/bundle/macos/Argos.app Argos-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Argos-macOS
          path: Argos-macOS.zip
          if-no-files-found: error
